name: Bug Report
description: Something not working as expected
labels: ["bug"]
body:
  - type: dropdown
    id: model
    attributes:
      label: Which model?
      options:
        - Qwen 3.8 27B
        - Gemma 4 31B
        - Gemma 4 12B
        - Hermes 4 14B
        - Gemma 4 E4B
        - Other
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Mac model + RAM
      placeholder: "e.g. M4 Max 128GB"
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor report
      description: "Run `bash scripts/doctor.sh --report` (Windows: `powershell -File scripts\\doctor.ps1 -Report`) and paste the block. It leaves out usernames, paths, hostnames and IPs."
      render: text
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      render: shell
